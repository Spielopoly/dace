[pytest]
filterwarnings =
    # Ignoriert Warnung zu Variable-length array A_tile mit komplexem Ausdruck (Heap statt Register)
    ignore:Variable-length array .*Heap .*Register:UserWarning
    # Ignoriert DeprecationWarning zu ast.Num (veraltet, ast.Constant verwenden)
    ignore:.*ast\.Num.*:DeprecationWarning
    ignore:An increment of Map .* was negative, which is .*:UserWarning